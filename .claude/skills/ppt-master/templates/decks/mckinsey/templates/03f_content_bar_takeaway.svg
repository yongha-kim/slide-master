  </g>
  <g id="page-number-slot" data-pptx-placeholder="slide-number" data-pptx-placeholder-idx="3" data-pptx-placeholder-bounds="1100 684 136 20">
    <text id="page-number-carrier" data-pptx-placeholder-carrier="true" x="1236" y="698" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" text-anchor="end" fill="#888888">{{PAGE_NUM}}</text>
  </g>
  <g id="page-kicker"><text x="44" y="32" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13.3" letter-spacing="0.6" fill="#0F2A4A">{{KICKER}}</text></g>

  <g id="agenda-tracker">
    <rect x="1134" y="20" width="12" height="12" fill="none" stroke="#D0D0D0" stroke-width="1"/>
