    <rect x="1174" y="20" width="12" height="12" fill="none" stroke="#D0D0D0" stroke-width="1"/>
    <rect x="1194" y="20" width="12" height="12" fill="none" stroke="#D0D0D0" stroke-width="1"/>
    <rect x="1214" y="20" width="12" height="12" fill="none" stroke="#D0D0D0" stroke-width="1"/>
  </g>

  <g id="bar-exhibit-slot" data-pptx-placeholder="object" data-pptx-placeholder-idx="10" data-pptx-placeholder-binding="proxy" data-pptx-placeholder-bounds="44 136 768 500">
    <text x="44" y="158" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="15" fill="#1A1A1A">Exhibit · 세그먼트별 매출 기여</text>
    <text x="812" y="158" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="12" fill="#888888">2025 · 억 원</text>
    <g id="bar-row-1">
      <text x="44" y="218" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#0F2A4A">세그먼트 A</text>
      <rect x="216" y="198" width="536" height="28" fill="#F2F2F2"/>
      <rect x="216" y="198" width="482" height="28" fill="#0F2A4A"/>
      <text x="812" y="218" text-anchor="end" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#0F2A4A">720</text>
    </g>
    <g id="bar-row-2">
      <text x="44" y="290" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">세그먼트 B</text>
      <rect x="216" y="270" width="536" height="28" fill="#F2F2F2"/>
      <rect x="216" y="270" width="295" height="28" fill="#D0D0D0"/>
      <text x="812" y="290" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">440</text>
    </g>
    <g id="bar-row-3">
      <text x="44" y="362" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">세그먼트 C</text>
      <rect x="216" y="342" width="536" height="28" fill="#F2F2F2"/>
      <rect x="216" y="342" width="201" height="28" fill="#D0D0D0"/>
      <text x="812" y="362" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">300</text>
    </g>
    <g id="bar-row-4">
      <text x="44" y="434" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">세그먼트 D</text>
      <rect x="216" y="414" width="536" height="28" fill="#F2F2F2"/>
      <rect x="216" y="414" width="121" height="28" fill="#D0D0D0"/>
      <text x="812" y="434" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">180</text>
    </g>
    <g id="bar-row-5">
      <text x="44" y="506" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">세그먼트 E</text>
      <rect x="216" y="486" width="536" height="28" fill="#F2F2F2"/>
      <rect x="216" y="486" width="80" height="28" fill="#D0D0D0"/>
      <text x="812" y="506" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">120</text>
    </g>
    <line x1="216" y1="540" x2="812" y2="540" stroke="#E8E8E8" stroke-width="1"/>
    <text x="44" y="570" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.3" fill="#888888">합계 1,760억 원 · 세그먼트 A 비중 41%</text>
  </g>

  <g id="takeaway-slot" data-pptx-placeholder="object" data-pptx-placeholder-idx="11" data-pptx-placeholder-binding="proxy" data-pptx-placeholder-bounds="860 136 376 500">
    <rect x="860" y="136" width="376" height="500" fill="#F2F2F2"/>
    <rect x="860" y="136" width="4" height="500" fill="#0F2A4A"/>
    <text x="892" y="182" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="13.3" letter-spacing="0.6" fill="#0F2A4A">KEY TAKEAWAY</text>
    <text x="892" y="232" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="29" font-weight="700" fill="#0F2A4A">41%</text>
    <text x="892" y="258" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="13.3" fill="#888888">2025 세그먼트 A 매출 비중</text>
    <text x="892" y="312" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#1A1A1A">성장 여력은 세그먼트 A에</text>
    <text x="892" y="340" font-family="'Pretendard SemiBold', Pretendard, 'Malgun Gothic', sans-serif" font-size="18.7" fill="#1A1A1A">집중되어 있다</text>
    <text x="892" y="388" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">• 상위 1개 세그먼트가</text>
    <text x="908" y="412" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">하위 3개 합계를 상회</text>
    <text x="892" y="448" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">• 투자 우선순위를 A에</text>
    <text x="908" y="472" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">재배분할 근거</text>
  </g>
